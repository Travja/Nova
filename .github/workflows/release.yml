name: Release

# Pushing a tag vMAJOR.MINOR.PATCH publishes ghcr.io/travja/nova:vX.Y.Z for
# linux/amd64 and linux/arm64, then moves :stable to it if it is the highest
# release on main. Nothing here reaches a host: hosts pull :stable themselves.
#
# A pull request that touches the image's inputs runs the same build and smoke
# test for both architectures with every push step skipped, so an arm64-only
# breakage shows up in review rather than at release time.
#
# How to cut a release: docs/DEPLOYMENT.md, "Releases".

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - '.github/workflows/ci.yml'
      - 'Dockerfile'
      - '.dockerignore'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'

permissions:
  contents: read

# Releases queue behind each other instead of racing for :stable. The group
# must not collide with ci.yml's own `<workflow>-<ref>` group once it runs as
# part of this workflow; group names are case-insensitive, hence `nova-`.
concurrency:
  group: nova-release-${{ github.event_name == 'push' && 'publish' || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/travja/nova
  SOURCE: https://github.com/Travja/Nova

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      latest: ${{ steps.check.outputs.latest }}
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check the tag
        id: check
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$EVENT" != push ]; then
            echo "Dry run: build and smoke test only, nothing is pushed."
            echo "version=pr-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
            echo "latest=false" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::$TAG is not vMAJOR.MINOR.PATCH"
            exit 1
          fi

          commit=$(git rev-parse "refs/tags/$TAG^{commit}")
          if ! git merge-base --is-ancestor "$commit" origin/main; then
            echo "::error::$TAG points at $commit, which is not on main. Release from main only."
            exit 1
          fi

          # :stable only ever moves forward. A patch to an older line, or a
          # re-run of an old tag, publishes its own version and leaves :stable.
          highest=$(git tag --merged origin/main -l 'v*' \
            | grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' \
            | sort -V | tail -n 1)
          latest=false
          if [ "$highest" = "$TAG" ]; then latest=true; fi
          echo "Releasing $TAG ($commit); highest release on main is $highest; move :stable: $latest"

          publish=true
          if [ "$REPO" != Travja/Nova ]; then publish=false; fi

          echo "version=$TAG" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  # The same lint, types, tests, e2e, image and restore-drill jobs a PR has to
  # pass, run again against the exact tagged commit.
  verify:
    needs: gate
    uses: ./.github/workflows/ci.yml

  build:
    needs: [gate, verify]
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Native runners for both architectures: better-sqlite3 compiles from
      # source when no prebuilt binary matches, which under QEMU takes ages.
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: nova:smoke
          provenance: false
          sbom: false
          labels: |
            org.opencontainers.image.source=${{ env.SOURCE }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.gate.outputs.version }}
          # main's CI cache (default scope) seeds amd64; each arch also keeps
          # its own scope so the two never evict each other.
          cache-from: |
            type=gha
            type=gha,scope=release-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.arch }}

      - name: Smoke test on an empty volume
        run: |
          docker run -d --name nova-smoke -p 3000:3000 \
            -e ORIGIN=http://localhost:3000 nova:smoke
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3000/health; then
              echo; echo "Healthy after ${i}s on $(docker exec nova-smoke uname -m)"
              exit 0
            fi
            sleep 1
          done
          echo "::error::/health did not return 200 within 60s"
          docker logs nova-smoke
          exit 1

      - name: Log in to GHCR
        if: needs.gate.outputs.publish == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Same build, so every layer comes from the builder's cache. Pushed by
      # digest only: the tags are put on the multi-arch index in `publish`.
      - name: Push by digest
        if: needs.gate.outputs.publish == 'true'
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          provenance: false
          sbom: false
          labels: |
            org.opencontainers.image.source=${{ env.SOURCE }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.gate.outputs.version }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Save digest
        if: needs.gate.outputs.publish == 'true'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v7
        if: needs.gate.outputs.publish == 'true'
        with:
          name: digest-${{ matrix.arch }}
          path: digests/*
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: [gate, build]
    if: needs.gate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.index.outputs.digest }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse to overwrite a published version
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          if docker buildx imagetools inspect "$IMAGE:$VERSION" >/dev/null 2>&1; then
            echo "::error::$IMAGE:$VERSION already exists. Versions are immutable; tag a new one."
            exit 1
          fi

      - name: Create the multi-arch index
        id: index
        working-directory: digests
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          test "$(ls | wc -l)" -eq 2
          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.source=$SOURCE" \
            --annotation "index:org.opencontainers.image.revision=$GITHUB_SHA" \
            --annotation "index:org.opencontainers.image.version=$VERSION" \
            -t "$IMAGE:$VERSION" \
            $(printf "$IMAGE@sha256:%s " *)
          docker buildx imagetools inspect "$IMAGE:$VERSION"
          digest=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Published \`$IMAGE:$VERSION\` = \`$digest\`" >> "$GITHUB_STEP_SUMMARY"

  # Hosts follow :stable, so this is the step that deploys. The `release`
  # environment is where a required reviewer can be added (Settings ->
  # Environments) to make moving :stable a deliberate click.
  promote:
    needs: [gate, publish]
    if: needs.gate.outputs.latest == 'true'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Move stable
        env:
          DIGEST: ${{ needs.publish.outputs.digest }}
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          docker buildx imagetools create -t "$IMAGE:stable" "$IMAGE@$DIGEST"
          moved=$(docker buildx imagetools inspect "$IMAGE:stable" --format '{{json .Manifest}}' | jq -r .digest)
          if [ "$moved" != "$DIGEST" ]; then
            echo "::error::stable is $moved, expected $DIGEST"
            exit 1
          fi
          echo "\`$IMAGE:stable\` -> $VERSION (\`$DIGEST\`)" >> "$GITHUB_STEP_SUMMARY"
